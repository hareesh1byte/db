<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Information Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head><body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="login" class="overlay"><form class="glass pane login" id="lf"><h1>Student Portal</h1><p>Sign in to manage records.</p>
<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn">Sign in</button></form></div>
<div class="app" id="app" hidden><nav class="glass pane" aria-label="Main"><h2>Portal</h2>
<button data-v="dash" class="on">Dashboard</button><button data-v="students">Students</button><button data-v="attendance">Attendance</button><button data-v="grades">Grades</button>
<button id="out" class="out">Sign out</button></nav><main id="main" tabindex="-1"></main></div>
<div id="modal" class="overlay" hidden><form class="glass pane" id="mf" role="dialog" aria-modal="true"></form></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script></body></html>
